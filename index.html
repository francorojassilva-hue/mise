<!doctype html>
<html lang="pt-BR" data-theme="A">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6d28d9" />
    <meta name="description" content="Mise — nutrição e meal prep: o que comer agora, a semana A/B/C e o preparo das marmitas." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mise" />
    <link rel="icon" type="image/png" href="/mise/favicon.png" />
    <link rel="apple-touch-icon" href="/mise/apple-touch-icon.png" />
    <title>Mise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("mise-theme") || "{}");
          var h = document.documentElement;
          h.dataset.theme = s.letter === "B" || s.letter === "C" ? s.letter : "A";
          h.classList.toggle("dark", s.mode === "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
